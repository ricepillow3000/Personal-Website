<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlanta Skyline Background</title>
  <meta name="description" content="Standalone demo of the 3-layer Atlanta skyline background (inline SVG + CSS, pointer parallax).">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@600;800&display=swap">
  <style>
    html, body { margin: 0; height: 100%; background: #050505; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; overflow: hidden; }
    .demo-ui { position: relative; z-index: 2; height: 100%; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
    .demo-card { background: #050505; border: 4px solid #FFFFFF; padding: 22px 30px; transform: rotate(-4deg) skewX(-8deg); box-shadow: 10px 10px 0 #E60012; max-width: 520px; }
    .demo-card > * { transform: skewX(8deg); }
    .demo-card h1 { font-family: Anton, Impact, sans-serif; font-size: clamp(36px, 7vw, 64px); line-height: 1; margin: 0 0 8px; font-weight: 400; }
    .demo-card p { margin: 0; font-weight: 600; }
    .demo-card a { color: #FFFFFF; }
  </style>
</head>
<body>
  <div id="skyline"></div>
  <main class="demo-ui">
    <div class="demo-card">
      <h1>ATLANTA</h1>
      <p>3-layer SVG skyline · move your mouse for parallax · <a href="/">back to the resume</a></p>
    </div>
  </main>
  <script type="module">
    import './src/styles/skyline.css';
    import { mountSkyline } from './src/fx/skyline.js';
    mountSkyline(document.getElementById('skyline'));
  </script>
</body>
</html>
